<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Bar - Kopi Pasar 4</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  body{background:#f8f9fa}
  .stat-card{border-radius:15px;color:white}
</style>
</head>
<body>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-0">🍺 Kasir Bar - Kopi Pasar 4</h2>
      <small class="text-muted">Jl. Pasar 4 | WA: 0831-5595-7895</small>
    </div>
    <button class="btn btn-danger" onclick="hapusSemua()"><i class="bi bi-trash"></i> Hapus Semua</button>
  </div>

  <!-- DASHBOARD STATISTIK -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card stat-card bg-primary p-3">
        <small>Total Pesanan</small>
        <h2 id="statPesanan">0</h2>
        <i class="bi bi-receipt fs-4"></i>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card bg-success p-3">
        <small>Total Omset Hari Ini</small>
        <h2 id="statOmset">Rp 0</h2>
        <i class="bi bi-cash-stack fs-4"></i>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card bg-warning p-3">
        <small>Total Item Terjual</small>
        <h2 id="statItem">0 Cup</h2>
        <i class="bi bi-cup-hot fs-4"></i>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card bg-dark p-3">
        <small>Menu Terlaris</small>
        <h4 id="statTerlaris">-</h4>
        <i class="bi bi-trophy fs-4"></i>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <!-- FORM TAMBAH / EDIT -->
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white fw-bold" id="judulForm">+ Tambah Pesanan</div>
        <div class="card-body">
          <input type="hidden" id="editId">
          <label>Nama Pelanggan</label>
          <input type="text" id="nama" class="form-control mb-2" placeholder="Contoh: Budi / Meja 1">

          <label>Menu Bar</label>
          <select id="menu" class="form-select mb-2" onchange="isiHarga()">
            <option value="Kopi Susu Gula Aren|15000">Kopi Susu Gula Aren - Rp 15.000</option>
            <option value="Kopi Hitam Robusta|10000">Kopi Hitam Robusta - Rp 10.000</option>
            <option value="Cappuccino|18000">Cappuccino - Rp 18.000</option>
            <option value="Es Kopi Pandan|16000">Es Kopi Pandan - Rp 16.000</option>
            <option value="Kopi Susu Karamel|17000">Kopi Susu Karamel - Rp 17.000</option>
            <option value="Es Teh Manis|8000">Es Teh Manis - Rp 8.000</option>
            <option value="Mocktail Orange|20000">Mocktail Orange - Rp 20.000</option>
          </select>

          <label>Harga (Rp)</label>
          <input type="number" id="harga" class="form-control mb-2" value="15000">

          <label>Jumlah</label>
          <input type="number" id="jumlah" class="form-control mb-2" value="1" min="1" oninput="hitungTotal()">

          <label>Total</label>
          <input type="text" id="total" class="form-control mb-2 fw-bold" readonly value="Rp 15.000">

          <label>Status</label>
          <select id="status" class="form-select mb-3">
            <option value="Belum Bayar">Belum Bayar</option>
            <option value="Lunas">Lunas</option>
            <option value="Proses">Proses</option>
          </select>

          <button class="btn btn-success w-100 mb-2" onclick="simpanPesanan()" id="btnSimpan"><i class="bi bi-plus-circle"></i> Tambah Pesanan</button>
          <button class="btn btn-secondary w-100" onclick="resetForm()">Batal / Reset</button>
        </div>
      </div>
    </div>

    <!-- DAFTAR PESANAN -->
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between">
          <span class="fw-bold">Daftar Pesanan</span>
          <input type="text" id="cari" class="form-control form-control-sm w-50" placeholder="Cari nama / menu..." onkeyup="tampilkanPesanan()">
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-striped mb-0">
              <thead><tr><th>#</th><th>Nama</th><th>Menu</th><th>Qty</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead>
              <tbody id="listPesanan"></tbody>
            </table>
          </div>
          <p id="kosong" class="text-center text-muted py-3">Belum ada pesanan. Tambah pesanan dulu ya.</p>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-outline-success" onclick="exportWA()"><i class="bi bi-whatsapp"></i> Kirim Rekap ke WA</button>
        <button class="btn btn-outline-primary" onclick="window.print()"><i class="bi bi-printer"></i> Print Struk</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== PENYIMPANAN PERMANEN (LocalStorage) =====
let pesanan = JSON.parse(localStorage.getItem('kasirBar')) || [];
let editId = null;

function simpanKeStorage(){
  localStorage.setItem('kasirBar', JSON.stringify(pesanan));
}

function formatRupiah(angka){
  return 'Rp ' + angka.toLocaleString('id-ID');
}

// Isi harga otomatis saat pilih menu
function isiHarga(){
  let val = document.getElementById('menu').value.split('|');
  document.getElementById('harga').value = val[1];
  hitungTotal();
}

function hitungTotal(){
  let harga = parseInt(document.getElementById('harga').value) || 0;
  let jumlah = parseInt(document.getElementById('jumlah').value) || 0;
  document.getElementById('total').value = formatRupiah(harga * jumlah);
}

// ===== TAMBAH & EDIT PESANAN =====
function simpanPesanan(){
  let nama = document.getElementById('nama').value.trim();
  let menuVal = document.getElementById('menu').value.split('|');
  let menu = menuVal[0];
  let harga = parseInt(document.getElementById('harga').value) || 0;
  let jumlah = parseInt(document.getElementById('jumlah').value) || 1;
  let status = document.getElementById('status').value;

  if(!nama){ alert('Isi nama pelanggan dulu!'); return; }

  let total = harga * jumlah;
  let waktu = new Date().toLocaleString('id-ID');

  if(editId !== null){
    // MODE EDIT
    let index = pesanan.findIndex(p => p.id === editId);
    pesanan[index] = {id: editId, nama, menu, harga, jumlah, total, status, waktu};
    editId = null;
    document.getElementById('judulForm').innerText = '+ Tambah Pesanan';
    document.getElementById('btnSimpan').innerHTML = '<i class="bi bi-plus-circle"></i> Tambah Pesanan';
  } else {
    // MODE TAMBAH
    pesanan.unshift({id: Date.now(), nama, menu, harga, jumlah, total, status, waktu});
  }

  simpanKeStorage();
  tampilkanPesanan();
  resetForm();
}

function editPesanan(id){
  let p = pesanan.find(x => x.id === id);
  if(!p) return;
  editId = id;
  document.getElementById('nama').value = p.nama;
  // cari menu di select
  let select = document.getElementById('menu');
  for(let i=0;i<select.options.length;i++){
    if(select.options[i].value.startsWith(p.menu+'|')) select.selectedIndex = i;
  }
  document.getElementById('harga').value = p.harga;
  document.getElementById('jumlah').value = p.jumlah;
  document.getElementById('status').value = p.status;
  hitungTotal();
  document.getElementById('judulForm').innerText = '✏️ Edit Pesanan - ' + p.nama;
  document.getElementById('btnSimpan').innerHTML = '💾 Simpan Perubahan';
  window.scrollTo({top:0, behavior:'smooth'});
}

// ===== HAPUS PESANAN =====
function hapusPesanan(id){
  if(confirm('Yakin mau hapus pesanan ini?')){
    pesanan = pesanan.filter(p => p.id !== id);
    simpanKeStorage();
    tampilkanPesanan();
  }
}

function hapusSemua(){
  if(confirm('Hapus SEMUA pesanan? Data tidak bisa dikembalikan!')){
    pesanan = [];
    simpanKeStorage();
    tampilkanPesanan();
  }
}

// ===== TAMPILKAN DAFTAR + STATISTIK =====
function tampilkanPesanan(){
  let cari = document.getElementById('cari').value.toLowerCase();
  let tbody = document.getElementById('listPesanan');
  tbody.innerHTML = '';

  let filtered = pesanan.filter(p => p.nama.toLowerCase().includes(cari) || p.menu.toLowerCase().includes(cari));

  document.getElementById('kosong').style.display = filtered.length === 0 ? 'block' : 'none';

  filtered.forEach((p, i) => {
    let badge = p.status === 'Lunas' ? 'bg-success' : p.status === 'Proses' ? 'bg-warning text-dark' : 'bg-danger';
    tbody.innerHTML += `
      <tr>
        <td>${i+1}</td>
        <td><b>${p.nama}</b><br><small class="text-muted">${p.waktu}</small></td>
        <td>${p.menu}<br><small>${formatRupiah(p.harga)}</small></td>
        <td>${p.jumlah}</td>
        <td class="fw-bold">${formatRupiah(p.total)}</td>
        <td><span class="badge ${badge}">${p.status}</span></td>
        <td>
          <button class="btn btn-sm btn-warning" onclick="editPesanan(${p.id})"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-danger" onclick="hapusPesanan(${p.id})"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`;
  });

  // HITUNG STATISTIK
  let totalOmset = pesanan.reduce((a,b)=>a+b.total, 0);
  let totalItem = pesanan.reduce((a,b)=>a+b.jumlah, 0);
  document.getElementById('statPesanan').innerText = pesanan.length;
  document.getElementById('statOmset').innerText = formatRupiah(totalOmset);
  document.getElementById('statItem').innerText = totalItem + ' Cup';

  // Menu terlaris
  let hitungMenu = {};
  pesanan.forEach(p => hitungMenu[p.menu] = (hitungMenu[p.menu]||0) + p.jumlah);
  let terlaris = Object.keys(hitungMenu).sort((a,b)=>hitungMenu[b]-hitungMenu[a])[0];
  document.getElementById('statTerlaris').innerText = terlaris || '-';
}

function resetForm(){
  document.getElementById('nama').value = '';
  document.getElementById('jumlah').value = 1;
  document.getElementById('status').value = 'Belum Bayar';
  editId = null;
  document.getElementById('judulForm').innerText = '+ Tambah Pesanan';
  document.getElementById('btnSimpan').innerHTML = '<i class="bi bi-plus-circle"></i> Tambah Pesanan';
  isiHarga();
}

function exportWA(){
  if(pesanan.length===0){ alert('Belum ada pesanan'); return; }
  let teks = 'REKAP KASIR BAR - Kopi Pasar 4%0A----------------%0A';
  pesanan.forEach((p,i)=>{ teks += `${i+1}. ${p.nama} - ${p.menu} x${p.jumlah} = Rp ${p.total.toLocaleString('id-ID')} (${p.status})%0A`; });
  let total = pesanan.reduce((a,b)=>a+b.total,0);
  teks += `----------------%0ATOTAL OMSET: Rp ${total.toLocaleString('id-ID')}`;
  window.open(`https://wa.me/6283155957895?text=${teks}`, '_blank');
}

// Jalankan saat pertama dibuka
isiHarga();
tampilkanPesanan();
</script>
</body>
</html>
